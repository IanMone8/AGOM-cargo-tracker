# Render Blueprint for AGOM Cargo Tracker: one web service + one PostgreSQL database, both in Singapore.
# Render → New → Blueprint → pick this repository. Secrets are generated by Render, never stored here.
# Plans: check prices on render.com before applying (the free Postgres plan expires after 30 days and has no backups).
services:
  - type: web
    name: agom-cargo-tracker
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_roles
    startCommand: gunicorn agom.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agom-db
          property: connectionString
      - key: TIME_ZONE
        value: Asia/Yangon
      # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS: the *.onrender.com address is added automatically
      # (RENDER_EXTERNAL_HOSTNAME). For your own domain add e.g. ALLOWED_HOSTS=cargo.agom.com and
      # CSRF_TRUSTED_ORIGINS=https://cargo.agom.com in the Render dashboard.

databases:
  - name: agom-db
    databaseName: agom
    user: agom
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # only the web service (Render's private network) can reach it
