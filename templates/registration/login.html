{% extends "base.html" %}
{% load static tracker_tags %}
{% block title %}Log in · AGOM Cargo Tracker{% endblock %}
{% block public %}
<div class="grad-page flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center text-ink">
      <img src="{% static_v 'img/display/3d-logo.png' %}" alt="AGOM Golf Shop" width="128" height="128" class="mx-auto mb-4 h-32 w-32 rounded-3xl bg-card object-contain p-2 shadow-[inset_0_1px_0_#fff,0_3px_0_rgba(0,0,0,0.25),0_10px_18px_-8px_rgba(0,0,0,0.5)]" onerror="this.style.display='none'">
      <h1 class="text-2xl font-bold">AGOM Cargo Tracker</h1>
      <p class="text-sm text-ink">Japan → Myanmar golf shipments</p>
    </div>
    <form method="post" class="card space-y-4 p-6">
      {% csrf_token %}
      {% if form.errors %}
        <p class="rounded-xl bg-danger-bg px-3 py-2 text-sm text-danger-ink">Wrong username or password.</p>
      {% endif %}
      <label class="block text-sm font-semibold">Username
        <input name="username" autocomplete="username" autocapitalize="none" required autofocus class="field mt-1" value="{{ form.username.value|default:'' }}">
      </label>
      <label class="block text-sm font-semibold">Password
        <input type="password" name="password" autocomplete="current-password" required class="field mt-1">
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-full py-3">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
