<div class="mt-2 space-y-3 rounded-lg bg-violet-50 p-3">
  {% if suggestions %}
    <div>
      <div class="mb-1 text-xs font-semibold text-violet-900">Suggested matches</div>
      <div class="space-y-1">
        {% for item in suggestions %}
          <button class="block w-full rounded-lg bg-white px-3 py-2 text-left text-sm ring-1 ring-violet-200 hover:ring-violet-500"
                  hx-post="{% url 'request_attach' r.pk %}" hx-vals='{"japan_item": "{{ item.pk }}"}'
                  hx-target="#request-{{ r.pk }}" hx-swap="outerHTML">
            <b>{{ item.box.label }}</b> · {{ item.item_name }} {{ item.flex }} {{ item.loft }} ×{{ item.qty }}{% if item.customer %} · 👤 {{ item.customer }}{% endif %}
          </button>
        {% endfor %}
      </div>
    </div>
  {% endif %}
  <form hx-post="{% url 'request_attach' r.pk %}" hx-target="#request-{{ r.pk }}" hx-swap="outerHTML" class="space-y-2">
    <div class="text-xs font-semibold text-violet-900">Or pick a box and item</div>
    <select name="box" hx-get="{% url 'request_attach_items' %}" hx-target="#attach-items-{{ r.pk }}"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      <option value="">Choose box…</option>
      {% for b in boxes %}<option value="{{ b.pk }}">{{ b.label }} ({{ b.get_status_display }})</option>{% endfor %}
    </select>
    <select id="attach-items-{{ r.pk }}" name="japan_item" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-base">
      <option value="">Choose item…</option>
    </select>
    <div class="flex gap-2">
      <button class="flex-1 rounded-lg bg-violet-600 py-2 text-sm font-semibold text-white">Attach</button>
      <button type="button" class="rounded-lg bg-white px-4 py-2 text-sm ring-1 ring-slate-300" onclick="this.closest('[id^=attach-]').innerHTML=''">Cancel</button>
    </div>
  </form>
</div>
