<form class="card mb-3 space-y-3 p-4" hx-post="{% url 'extra_add' box.pk %}" hx-target="#extra-form-slot">
  <div class="grid grid-cols-4 gap-3">
    <div class="col-span-3">{% include "tracker/_field.html" with field=form.description %}</div>
    <div>{% include "tracker/_field.html" with field=form.qty %}</div>
  </div>
  <div class="flex gap-2">
    <button class="btn flex-1 bg-violet-600 text-white hover:bg-violet-700">Add extra item</button>
    <button type="button" class="btn btn-ghost" onclick="this.closest('form').remove()">Close</button>
  </div>
</form>
