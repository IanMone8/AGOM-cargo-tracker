<div id="extra-{{ extra.pk }}" class="flex items-center justify-between rounded-xl bg-violet-50 p-3 ring-1 ring-violet-200">
  <div><div class="font-semibold">{{ extra.description }}</div>
    <div class="text-xs text-slate-500">added by {{ extra.added_by.username|default:"—" }} · {{ extra.created_at|date:"j M" }}</div></div>
  <div class="flex items-center gap-3">
    <span class="text-xl font-bold">×{{ extra.qty }}</span>
    {% if can_check %}<button class="text-xs text-slate-400 hover:text-red-600" hx-post="{% url 'extra_delete' extra.pk %}"
      hx-target="#extra-{{ extra.pk }}" hx-swap="outerHTML" hx-confirm="Remove this extra item?">delete</button>{% endif %}
  </div>
</div>
