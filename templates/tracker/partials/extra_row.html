<div id="extra-{{ extra.pk }}" class="card flex items-center justify-between border-l-4 border-l-violet-400 p-4">
  <div><div class="font-bold">{{ extra.description }}</div>
    <div class="text-xs text-stone-500">added by {{ extra.added_by.username|default:"—" }} · {{ extra.created_at|date:"j M" }}</div></div>
  <div class="flex items-center gap-3">
    <span class="text-xl font-extrabold">×{{ extra.qty }}</span>
    {% if can_check %}<button class="text-xs font-semibold text-stone-400 hover:text-red-600" hx-post="{% url 'extra_delete' extra.pk %}"
      hx-target="#extra-{{ extra.pk }}" hx-swap="outerHTML" hx-confirm="Remove this extra item?">delete</button>{% endif %}
  </div>
</div>
