{% load tracker_tags %}
<section class="hero" aria-labelledby="hero-title">
  {# "fairway hill" behind the badge #}
  <svg class="hero-hill" viewBox="0 0 640 260" preserveAspectRatio="none" aria-hidden="true">
    <path d="M110 260 C 230 150, 360 120, 470 150 S 610 190, 640 160 L 640 260 Z" class="hill-1"/>
    <path d="M250 260 C 360 190, 470 180, 560 205 S 630 225, 640 215 L 640 260 Z" class="hill-2"/>
    <path d="M420 260 C 490 228, 560 222, 640 240 L 640 260 Z" class="hill-3"/>
  </svg>
  <div class="hero-text">
    <p class="hero-eyebrow">{% icon "flag" "w-4 h-4" %} Golf stock route</p>
    <h2 id="hero-title" class="hero-title"><span>Take with Trust.</span> <span>Play with Confidence.</span> <span>Get Achievements.</span></h2>
    <p class="hero-sub">Track every golf bag, club, and accessory by cargo and box.</p>
  </div>
  <img class="hero-badge" src="{% static_v 'img/display/agom-badge.webp' %}" alt="AGOM Golf Shop badge"
       width="196" height="196" onerror="this.style.display='none'">
</section>
