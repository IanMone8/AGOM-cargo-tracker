{% load tracker_tags %}{% comment %} An order's item lines (New order form and Edit): Item (brand + model combo box), club option, qty,
  price per piece (Ks). "+ Add item" copies the <template> row (static/js/payments.js). Context: lines (OrderLineFormSet). {% endcomment %}
{{ lines.management_form }}
{% for e in lines.non_form_errors %}<p class="rounded-xl bg-danger-bg px-3 py-2 text-sm font-semibold text-danger-ink">{{ e }}</p>{% endfor %}
<div class="space-y-3" data-lines>
  {% for f in lines.forms %}{% include "tracker/partials/order_line.html" %}{% endfor %}
</div>
<template data-line-template>{% include "tracker/partials/order_line.html" with f=lines.empty_form %}</template>
<div class="flex flex-wrap items-center justify-between gap-2">
  <button type="button" class="btn btn-soft" data-add-line>{% icon "plus" "w-4 h-4" %} Add item</button>
  {% if can_use_payments %}<p class="text-sm font-bold tabular-nums" data-order-total-live></p>{% endif %}
</div>
