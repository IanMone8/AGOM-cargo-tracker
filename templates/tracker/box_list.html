{% extends "base.html" %}
{% block content %}
<div class="mb-4 flex items-center justify-between">
  <h1 class="text-2xl font-bold">Boxes</h1>
  {% if can_edit_japan %}<a href="{% url 'box_create' %}" class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">+ New box</a>{% endif %}
</div>
<form class="mb-4 grid grid-cols-2 gap-2" hx-get="{% url 'box_list' %}" hx-target="#box-results" hx-trigger="change" hx-push-url="true">
  {{ form.cargo }}
  {{ form.status }}
</form>
<div id="box-results">{% include "tracker/partials/box_results.html" %}</div>
{% endblock %}
