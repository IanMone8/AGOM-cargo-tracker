<label class="block text-[0.8rem] font-semibold text-stone-600">{{ field.label }}{% if field.field.required %} <span class="text-emerald-700">*</span>{% endif %}
  <div class="mt-1">{{ field }}</div>
  {% if field.help_text %}<p class="mt-1 text-xs font-normal text-stone-500">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs font-medium text-red-600">{{ e }}</p>{% endfor %}
</label>
