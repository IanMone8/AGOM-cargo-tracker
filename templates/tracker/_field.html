<label class="block text-sm font-medium text-slate-700">{{ field.label }}{% if field.field.required %} *{% endif %}
  <div class="mt-1">{{ field }}</div>
  {% if field.help_text %}<p class="mt-1 text-xs font-normal text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</label>
