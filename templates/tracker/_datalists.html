<datalist id="catalog-types">{% for t in catalog_types %}<option value="{{ t }}">{% endfor %}</datalist>
<datalist id="catalog-models">{% for m in catalog_models %}<option value="{{ m }}">{% endfor %}</datalist>
<datalist id="catalog-lofts">{% for l in catalog_lofts %}<option value="{{ l }}">{% endfor %}</datalist>
<datalist id="item-categories">{% for c in item_categories %}<option value="{{ c }}">{% endfor %}</datalist>
<datalist id="customer-names">{% for n in customer_names %}<option value="{{ n }}">{% endfor %}</datalist>
<datalist id="brands">{% for b in brands %}<option value="{{ b }}">{% endfor %}</datalist>
