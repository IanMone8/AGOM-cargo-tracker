{# One "Piece N" price box under "Different prices": ¥ before for box items, Ks after for order lines (money.js builds the same markup when qty changes) #}
{% if currency == "Ks" %}<label class="piece-price">Piece {{ n }}<span class="ks-wrap mt-1"><input type="text" name="{{ name }}" value="{{ value }}" class="field" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" data-ks data-digits="Whole Kyat only, e.g. 450000" data-piece aria-label="Piece {{ n }} price (Ks)"><span class="ks-unit" aria-hidden="true">Ks</span></span></label>
{% else %}<label class="piece-price">Piece {{ n }}<span class="yen-wrap mt-1"><span class="yen-sign" aria-hidden="true">¥</span><input type="text" name="{{ name }}" value="{{ value }}" class="field" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" data-yen data-digits="Whole yen only, e.g. 12500" data-piece aria-label="Piece {{ n }} amount (JP¥)"></span></label>{% endif %}
