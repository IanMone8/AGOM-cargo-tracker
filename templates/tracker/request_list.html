{% extends "base.html" %}
{% block content %}
<div class="mb-4 flex items-center justify-between">
  <h1 class="text-2xl font-bold">Customer requests</h1>
  <button onclick="document.getElementById('new-request').classList.toggle('hidden')"
          class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">+ New request</button>
</div>

<form id="new-request" method="post" class="{% if not show_form %}hidden{% endif %} mb-4 space-y-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200">
  {% csrf_token %}
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
    {% for field in form %}<div class="{% if field.name == 'item_name' or field.name == 'note' %}col-span-2{% endif %}">{% include "tracker/_field.html" %}</div>{% endfor %}
  </div>
  <button class="w-full rounded-lg bg-emerald-700 py-2.5 font-semibold text-white sm:w-auto sm:px-6">Save request</button>
</form>

<form class="mb-4 grid grid-cols-2 gap-2" hx-get="{% url 'request_list' %}" hx-target="#request-results"
      hx-trigger="change, keyup changed delay:300ms from:input[name=q]" hx-push-url="true">
  <select name="status" class="rounded-lg border border-slate-300 px-3 py-2 text-base">
    <option value="active" {% if status == 'active' %}selected{% endif %}>Not fulfilled</option>
    <option value="all" {% if status == 'all' %}selected{% endif %}>All</option>
    {% for value, label in status_choices %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <input name="q" value="{{ q }}" placeholder="Search customer / item" class="rounded-lg border border-slate-300 px-3 py-2 text-base">
</form>

<div id="request-results">{% include "tracker/partials/request_results.html" %}</div>
{% endblock %}
{% block datalists %}{% include "tracker/_datalists.html" %}{% endblock %}
