{% extends "base.html" %}
{% block content %}
<a href="{% url 'request_list' %}" class="text-sm font-semibold text-emerald-700">← Requests</a>
<h1 class="mb-4 mt-1 text-2xl font-bold">Edit request</h1>
<form method="post" class="card space-y-4 p-5">
  {% csrf_token %}
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
    {% for field in form %}<div class="{% if field.name == 'item_name' or field.name == 'note' %}col-span-2{% endif %}">{% include "tracker/_field.html" %}</div>{% endfor %}
  </div>
  <button class="btn btn-primary w-full py-3 sm:w-auto sm:px-8">Save</button>
</form>
{% endblock %}
{% block datalists %}{% include "tracker/_datalists.html" %}{% endblock %}
